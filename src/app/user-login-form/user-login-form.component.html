<!-- src/app/user-login-form/user-login-form.component.html -->
  <mat-card>
    <mat-card-header>
      <mat-card-title> Log In!</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form>
        <mat-form-field>
          <mat-icon matPrefix>person</mat-icon>
          <input
            matInput
            [(ngModel)]="userData.Username"
            placeholder="Username"
            type="text"
            name="Username"
            required
          >
          </mat-form-field>
          <mat-form-field>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            [(ngModel)]="userData.Password"
            type = "password"
            placeholder="Password"
            name="Password"
            required
          >
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
        <button
          mat-raised-button
          (click)="loginUser()"
          color="primary"
        >
          Log In
        </button>
    </mat-card-actions>
  </mat-card>
