<!-- src/app/movie-card/movie-card.component.html -->
<div style="display: flex;">
    <mat-card style="flex: 1 1 auto;">
        <mat-card-header>
        <mat-card-title>{{movie.Title}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <img src="{{movie.ImagePath}}" alt="{{movie.Title}}" />

            <p>{{ movie.Description }}</p>
        </mat-card-content>
        <mat-card-actions>
            <strong>Genre:</strong>
           <button
                (click)="openGenreDialog()"
                mat-button
                color="primary"
            >
                {{ movie.Genre.Name }}
            </button>
            <strong>Director:</strong>
            <button
                mat-button
                color="primary"
                (click)="openDirectorDialog()"
            >
                {{ movie.Director.Name }}
            </button>
            <button
            mat-icon-button>
            favorite_border 
        </button>
        </mat-card-actions>
    </mat-card>
</div>
