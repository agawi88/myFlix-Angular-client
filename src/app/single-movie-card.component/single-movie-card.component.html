<!-- src/app/movie-card/movie-card.component.html -->
<div style="display: flex;">
    <mat-card *ngIf="movie" style="flex: 1 1 auto;">
        <mat-card-header>
        <mat-card-title>{{movie.Title}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <img 
            mat-card-image
            [src]="movie?.ImageURL" [alt]="movie.Title" />
            <p><strong>Synopsis:</strong> {{ movie.Description }} </p>

            <p><strong>Release Year:</strong>
            {{ movie.ReleaseYear }}</p>

            <p><strong>Setting: </strong>
            {{ movie.Setting }}</p>
<!--             <strong>Actors:</strong>
            <p>{{ movie.Actors.join(', ') }}</p> -->

            <p><strong> Featured: </strong>
            {{ movie.Featured ? 'Yes' : 'No' }}</p>

            <div class="info-row">
                <span class="label"> Genre:   </span>
                <button
                (click)="openGenreDialog(movie.Genre)"
                mat-button
                color="primary">  
            {{ movie.Genre?.Name }}
            </button>
            </div>
            <div class="info-row">
            <span class="label"> Director:  </span>
            <button
                mat-button
                color="primary"
                (click)="openDirectorDialog(movie.Director)"
            >
                  {{ movie.Director?.Name }}
            </button>
            </div>
        </mat-card-content>
        <mat-card-actions>
            <p>
<!--             <button
            mat-icon-button
            class="likeButton"
            color="addMovieToFavs(movie._id)"
            (click)="addMovieToFavs(movie._id)"
            >
            <mat-icon> {{ isFavorite(movie._id) ? 'favorite' : 'favorite_border' }} </mat-icon>
            </button> -->
            <button mat-button class="closeButton" color="accent" (click)="goBack()">
            Return
            </button></p>
    </mat-card-actions>
    </mat-card>
</div>
