<!-- src/app/user-login-form/user-login-form.component.html -->
  <mat-card>
    <mat-card-header align="center">
      <mat-card-title>Edit User Data</mat-card-title>
    </mat-card-header>
    <mat-card-content align="center">
      <form>
        <mat-form-field>
          <input
            matInput
            [(ngModel)]="userData.Username"
            placeholder="Username"
            type="text"
            name="Username"
            required
          >
          </mat-form-field>
          <mat-form-field>
          <input
            matInput
            [(ngModel)]="userData.Password"
            type = "password"
            placeholder="Password"
            name="Password"
            required
          >
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
        <button
          mat-raised-button
          (click)="editUser()"
          color="primary"
          class="changeButton"
        >
          Confirm and Change Data
        </button>
        <button
          mat-raised-button
          mat-dialog-close
          color="accent"
          class="cancelButton"
        >
          Cancel
        </button>
    </mat-card-actions>
  </mat-card>
