<!-- src/app/movie-card/movie-card.component.html -->
<div style="display: flex;">
    <mat-card style="flex: 1 1 auto;">
        <mat-card-header *ngIf="data.director">
        <mat-card-title>{{data.director.Name}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <p>Name:{{ data.director.Name }}</p>
            <p>Bio: {{ data.director.Bio }}</p>
            <p>Born: {{ data.director.DateOfBirth }}</p>
            <p *ngIf="data.director.DateOfDeath">Died: {{ data.director.DateOfDeath }}</p>
        </mat-card-content>
        <mat-card-footer>
            <p>Movies by this director will be listed here.</p>
        </mat-card-footer>
        <mat-card-actions>
            <button mat-button color="primary" (click)="dialogRef.close()">Close</button>
        </mat-card-actions>
    </mat-card>
</div>
